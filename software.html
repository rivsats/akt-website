<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AKT Software — Download Software</title>
  <meta
    name="description"
    content="Download software pilihan untuk berbagai kebutuhan di AKT."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #fcfaff;
      color: #24202d;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    /* =========================
       NAVBAR
    ========================= */

    nav {
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(252, 250, 255, 0.92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid #eee8f6;
    }

    .nav-inner {
      max-width: 1200px;
      margin: auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: -0.06em;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
      font-size: 0.94rem;
      font-weight: 600;
      color: #665f70;
    }

    .nav-links a {
      transition: 0.2s ease;
    }

    .nav-links a:hover {
      color: #8b5cf6;
    }

    .nav-home {
      padding: 9px 16px;
      border-radius: 999px;
      background: #f0eafd;
      color: #7652c9 !important;
    }

    .nav-home:hover {
      background: #e8defc;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      max-width: 1200px;
      margin: auto;
      padding: 74px 24px 38px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      background: #f2ebff;
      color: #8258d3;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: clamp(2.3rem, 6vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -0.06em;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #30273b, #8b5cf6 55%, #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      color: #766e80;
      font-size: 1.05rem;
    }

    /* =========================
       CONTROLS
    ========================= */

    .controls {
      max-width: 1200px;
      margin: 18px auto 42px;
      padding: 0 24px;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #9c94a8;
      font-size: 1.1rem;
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      border: 1px solid #e8e0f1;
      background: white;
      border-radius: 18px;
      padding: 16px 18px 16px 48px;
      outline: none;
      color: #302b38;
      box-shadow: 0 8px 28px rgba(65, 38, 99, 0.05);
      transition: 0.2s ease;
    }

    #searchInput:focus {
      border-color: #b995ef;
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.10);
    }

    .filter-list {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .filter-btn {
      border: 1px solid #e6deef;
      background: white;
      color: #71697c;
      border-radius: 999px;
      padding: 8px 15px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 650;
      transition: 0.2s ease;
    }

    .filter-btn:hover {
      border-color: #c6a8f2;
      color: #8155d2;
      transform: translateY(-1px);
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #8b5cf6, #d946ef);
      border-color: transparent;
      color: white;
      box-shadow: 0 8px 18px rgba(139, 92, 246, 0.2);
    }

    /* =========================
       CONTENT
    ========================= */

    .content {
      max-width: 1200px;
      margin: auto;
      padding: 0 24px 80px;
    }

    .result-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      color: #847b8d;
      font-size: 0.9rem;
    }

    .software-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    /* =========================
       CARD
    ========================= */

    .software-card {
      background: white;
      border: 1px solid #eee7f4;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(56, 36, 75, 0.055);
      transition:
        transform 0.22s ease,
        box-shadow 0.22s ease,
        border-color 0.22s ease;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .software-card:hover {
      transform: translateY(-5px);
      border-color: #dfcef7;
      box-shadow: 0 18px 40px rgba(78, 45, 105, 0.10);
    }

    .card-image {
      height: 155px;
      background:
        radial-gradient(circle at 20% 20%, rgba(216, 191, 255, 0.35), transparent 32%),
        radial-gradient(circle at 80% 80%, rgba(251, 207, 232, 0.35), transparent 34%),
        #f7f3fc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid #f0eaf5;
    }

    .card-image img {
      width: 82px;
      height: 82px;
      object-fit: contain;
      border-radius: 18px;
      transition: transform 0.25s ease;
    }

    .software-card:hover .card-image img {
      transform: scale(1.07);
    }

    .fallback-icon {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border: 1px solid #e8def4;
      font-size: 2.5rem;
      box-shadow: 0 8px 20px rgba(70, 40, 90, 0.08);
    }

    .card-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-tag {
      display: inline-flex;
      align-self: flex-start;
      padding: 5px 10px;
      border-radius: 999px;
      background: #f2ebff;
      color: #8057d0;
      font-size: 0.72rem;
      font-weight: 800;
      margin-bottom: 11px;
    }

    .card-body h3 {
      font-size: 1.05rem;
      line-height: 1.3;
      margin-bottom: 8px;
      color: #302a38;
      letter-spacing: -0.02em;
    }

    .description {
      color: #7c7485;
      font-size: 0.84rem;
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-top: auto;
      margin-bottom: 15px;
    }

    .meta-item {
      background: #faf8fc;
      border: 1px solid #f0eaf5;
      border-radius: 10px;
      padding: 7px 9px;
      min-width: 0;
    }

    .meta-label {
      display: block;
      font-size: 0.64rem;
      color: #a097a9;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 750;
    }

    .meta-value {
      display: block;
      color: #5f5769;
      font-size: 0.75rem;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .estimated {
      color: #8b5cf6;
    }

    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      border-radius: 13px;
      padding: 11px 14px;
      background: linear-gradient(135deg, #8b5cf6, #d946ef);
      color: white;
      font-size: 0.86rem;
      font-weight: 800;
      transition: 0.2s ease;
    }

    .download-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.23);
    }

    .download-btn.disabled {
      background: #eeeaf2;
      color: #9b94a1;
      pointer-events: none;
    }

    /* =========================
       STATES
    ========================= */

    .loading,
    .empty,
    .error {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      border: 1px dashed #ddd2e8;
      border-radius: 22px;
      background: white;
      color: #82788b;
    }

    .loading-icon {
      font-size: 2rem;
      margin-bottom: 10px;
      animation: pulse 1.3s infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.45;
      }

      50% {
        opacity: 1;
      }
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      border-top: 1px solid #eee7f3;
      background: #faf8fd;
      padding: 30px 24px;
    }

    .footer-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      color: #8b8294;
      font-size: 0.84rem;
    }

    .footer-logo {
      font-weight: 900;
      color: #7c52c8;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1050px) {
      .software-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 780px) {
      .nav-inner {
        padding: 14px 18px;
      }

      .nav-links {
        gap: 13px;
        font-size: 0.8rem;
      }

      .nav-home {
        display: none;
      }

      .hero {
        padding: 55px 18px 28px;
      }

      .controls,
      .content {
        padding-left: 18px;
        padding-right: 18px;
      }

      .software-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 15px;
      }
    }

    @media (max-width: 520px) {
      .logo {
        font-size: 1.4rem;
      }

      .nav-links {
        gap: 10px;
      }

      .nav-links a:nth-child(4),
      .nav-links a:nth-child(5) {
        display: none;
      }

      .hero h1 {
        font-size: 2.5rem;
      }

      .hero p {
        font-size: 0.92rem;
      }

      .software-grid {
        grid-template-columns: 1fr;
      }

      .card-image {
        height: 145px;
      }

      .footer-inner {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       NAVBAR
  ========================== -->

  <nav>
    <div class="nav-inner">

      <a href="index.html" class="logo">AKT</a>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="software.html">Software</a>
        <a href="games.html">Games</a>
        <a href="#">Tools</a>
        <a href="#">Knowledge</a>
        <a href="index.html" class="nav-home">← Home</a>
      </div>

    </div>
  </nav>


  <!-- =========================
       HERO
  ========================== -->

  <header class="hero">

    <div class="eyebrow">
      ✦ AKT SOFTWARE
    </div>

    <h1>Software untuk semua kebutuhan.</h1>

    <p>
      Temukan berbagai software pilihan untuk produktivitas,
      kreativitas, komunikasi, multimedia, dan kebutuhan sehari-hari.
    </p>

  </header>


  <!-- =========================
       CONTROLS
  ========================== -->

  <section class="controls">

    <div class="search-wrap">
      <span class="search-icon">⌕</span>

      <input
        type="search"
        id="searchInput"
        placeholder="Cari software..."
        autocomplete="off"
      >
    </div>

    <div
      class="filter-list"
      id="filterList"
    >
      <button
        class="filter-btn active"
        data-category="All"
        type="button"
        onclick="selectCategory('All', this)"
      >
        Semua
      </button>
    </div>

  </section>


  <!-- =========================
       SOFTWARE CONTENT
  ========================== -->

  <main class="content">

    <div class="result-info">
      <span id="resultCount">Memuat software...</span>
    </div>

    <div
      class="software-grid"
      id="softwareGrid"
    >

      <div class="loading">
        <div class="loading-icon">◌</div>
        <div>Memuat data software...</div>
      </div>

    </div>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    <div class="footer-inner">

      <div>
        <span class="footer-logo">AKT</span>
        <span> — Downloads & Knowledge</span>
      </div>

      <div>
        © <span id="year"></span> AKT
      </div>

    </div>

  </footer>


  <script>
    /* =========================================================
       GOOGLE SHEETS CSV
    ========================================================= */

    const AKT_SHEET_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vTmhKZ9XD_fsfwXXAhpzIv-LZGER5UyJ-RI1Lgj3P6viDWqKiuED4k9tNu6qRdp1uueO1XGka22k20m/pub?gid=0&single=true&output=csv";


    /* =========================================================
       GLOBAL STATE
    ========================================================= */

    let softwareData = [];
    let selectedCategory = "All";
    let searchTerm = "";


    /* =========================================================
       ESTIMATED SOFTWARE SIZE
       
       Dipakai hanya jika kolom Size di Google Sheets kosong.
       Tanda "~" menunjukkan bahwa angka tersebut adalah estimasi.
    ========================================================= */

    function getEstimatedSize(title) {

      const estimates = {

        "Google Chrome": "~120 MB",
        "Mozilla Firefox": "~90 MB",
        "Microsoft Edge": "~130 MB",
        "VLC Media Player": "~40 MB",
        "7-Zip": "~2 MB",
        "WinRAR": "~4 MB",
        "LibreOffice": "~350 MB",
        "Adobe Acrobat Reader": "~300 MB",
        "Zoom Workplace": "~100 MB",
        "Microsoft Teams": "~150 MB",
        "Slack": "~150 MB",
        "Visual Studio Code": "~110 MB",
        "Git": "~60 MB",
        "GitHub Desktop": "~200 MB",
        "Notepad++": "~5 MB",
        "OBS Studio": "~130 MB",
        "GIMP": "~250 MB",
        "ShareX": "~30 MB",
        "Microsoft PowerToys": "~150 MB",
        "SumatraPDF": "~10 MB"

      };

      const normalizedTitle =
        String(title || "")
          .trim()
          .toLowerCase();

      for (const key in estimates) {

        if (
          normalizedTitle === key.toLowerCase()
        ) {
          return estimates[key];
        }

      }

      return "~100 MB";
    }


    /* =========================================================
       GET SOFTWARE THUMBNAIL
       
       Prioritas:
       1. Thumbnail dari Google Sheets
       2. Icon berdasarkan domain Download URL
       3. Fallback icon
    ========================================================= */

    function getSoftwareIcon(item) {

      const thumbnail =
        String(item.Thumbnail || "").trim();

      if (thumbnail) {
        return thumbnail;
      }

      const downloadUrl =
        String(item["Download URL"] || "").trim();

      if (downloadUrl) {

        try {

          const url =
            new URL(downloadUrl);

          const domain =
            url.hostname.replace(/^www\./, "");

          if (domain) {

            return (
              "https://www.google.com/s2/favicons?domain=" +
              encodeURIComponent(domain) +
              "&sz=256"
            );

          }

        } catch (error) {
          // fallback icon digunakan di bawah
        }

      }

      return "";
    }


    /* =========================================================
       LOAD SOFTWARE
    ========================================================= */

    async function loadSoftware() {

      const grid =
        document.getElementById("softwareGrid");

      try {

        const response =
          await fetch(AKT_SHEET_URL, {
            cache: "no-store"
          });

        if (!response.ok) {
          throw new Error(
            "Gagal mengambil data Google Sheets."
          );
        }

        const csv =
          await response.text();

        const rows =
          parseCSV(csv);

        if (!rows.length) {
          throw new Error(
            "Data Google Sheets kosong."
          );
        }

        const headers =
          rows[0].map(header =>
            String(header).trim()
          );

        softwareData =
          rows
            .slice(1)
            .filter(row =>
              row.some(cell =>
                String(cell || "").trim() !== ""
              )
            )
            .map(row => {

              const item = {};

              headers.forEach(
                (header, index) => {

                  item[header] =
                    row[index] !== undefined
                      ? String(row[index]).trim()
                      : "";

                }
              );

              return item;

            })
            .filter(item => {

              const type =
                String(item.Type || "")
                  .trim()
                  .toLowerCase();

              const status =
                String(item.Status || "")
                  .trim()
                  .toLowerCase();

              return (
                type === "software" &&
                (
                  !status ||
                  status === "published"
                )
              );

            });

        createCategoryFilters();

        renderSoftware();

      } catch (error) {

        console.error(error);

        grid.innerHTML = `
          <div class="error">
            <strong>Gagal memuat software.</strong>
            <br>
            <span>
              Pastikan Google Sheets sudah dipublish sebagai CSV
              dan dapat diakses publik.
            </span>
          </div>
        `;

        document.getElementById("resultCount")
          .textContent = "Data tidak dapat dimuat.";

      }

    }


    /* =========================================================
       CREATE CATEGORY FILTERS
    ========================================================= */

    function createCategoryFilters() {

      const filterList =
        document.getElementById("filterList");

      const categories =
        [
          ...new Set(
            softwareData
              .map(item =>
                String(item.Category || "").trim()
              )
              .filter(Boolean)
          )
        ]
        .sort((a, b) =>
          a.localeCompare(b)
        );

      filterList.innerHTML = `
        <button
          class="filter-btn active"
          data-category="All"
          type="button"
          onclick="selectCategory('All', this)"
        >
          Semua
        </button>
      `;

      categories.forEach(category => {

        const button =
          document.createElement("button");

        button.className =
          "filter-btn";

        button.type =
          "button";

        button.dataset.category =
          category;

        button.textContent =
          category;

        button.onclick =
          function () {
            selectCategory(
              category,
              this
            );
          };

        filterList.appendChild(button);

      });

    }


    /* =========================================================
       SELECT CATEGORY
    ========================================================= */

    function selectCategory(
      category,
      button
    ) {

      selectedCategory =
        category;

      document
        .querySelectorAll(".filter-btn")
        .forEach(btn =>
          btn.classList.remove("active")
        );

      if (button) {
        button.classList.add("active");
      }

      renderSoftware();

    }


    /* =========================================================
       SEARCH
    ========================================================= */

    document
      .getElementById("searchInput")
      .addEventListener(
        "input",
        function () {

          searchTerm =
            this.value
              .trim()
              .toLowerCase();

          renderSoftware();

        }
      );


    /* =========================================================
       RENDER SOFTWARE
    ========================================================= */

    function renderSoftware() {

      const grid =
        document.getElementById("softwareGrid");

      let filtered =
        softwareData.filter(item => {

          const category =
            String(item.Category || "")
              .trim();

          const title =
            String(item.Title || "")
              .toLowerCase();

          const description =
            String(item.Description || "")
              .toLowerCase();

          const developer =
            String(item.Developer || "")
              .toLowerCase();

          const categoryMatch =
            selectedCategory === "All" ||
            category === selectedCategory;

          const searchMatch =
            !searchTerm ||
            title.includes(searchTerm) ||
            description.includes(searchTerm) ||
            developer.includes(searchTerm) ||
            category.toLowerCase().includes(searchTerm);

          return (
            categoryMatch &&
            searchMatch
          );

        });


      document.getElementById("resultCount")
        .textContent =
        `${filtered.length} software ditemukan`;


      if (!filtered.length) {

        showEmpty();

        return;
      }


      grid.innerHTML =
        filtered
          .map(item =>
            createSoftwareCard(item)
          )
          .join("");

    }


    /* =========================================================
       CREATE SOFTWARE CARD
    ========================================================= */

    function createSoftwareCard(item) {

      const title =
        escapeHTML(
          item.Title || "Untitled Software"
        );

      const category =
        escapeHTML(
          item.Category || "Software"
        );

      const description =
        escapeHTML(
          item.Description ||
          "Software pilihan dari AKT."
        );

      const version =
        escapeHTML(
          item.Version || "-"
        );

      const os =
        escapeHTML(
          item.OS || "-"
        );

      const developer =
        escapeHTML(
          item.Developer || "-"
        );


      /* -------------------------------------------------------
         SIZE
      ------------------------------------------------------- */

      const sheetSize =
        String(item.Size || "")
          .trim();

      const hasSheetSize =
        sheetSize !== "";

      const sizeValue =
        hasSheetSize
          ? sheetSize
          : getEstimatedSize(item.Title);

      const size =
        escapeHTML(sizeValue);


      /* -------------------------------------------------------
         THUMBNAIL
      ------------------------------------------------------- */

      const imageUrl =
        getSoftwareIcon(item);


      let imageHTML = "";

      if (imageUrl) {

        imageHTML = `
          <img
            src="${escapeHTML(imageUrl)}"
            alt="${title}"
            loading="lazy"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          >

          <div
            class="fallback-icon"
            style="display:none;"
            aria-hidden="true"
          >
            💻
          </div>
        `;

      } else {

        imageHTML = `
          <div
            class="fallback-icon"
            aria-hidden="true"
          >
            💻
          </div>
        `;

      }


      /* -------------------------------------------------------
         DOWNLOAD URL
      ------------------------------------------------------- */

      const rawDownloadUrl =
        String(item["Download URL"] || "")
          .trim();

      let downloadHTML = "";

      if (rawDownloadUrl) {

        const safeDownloadUrl =
          escapeHTML(rawDownloadUrl);

        downloadHTML = `
          <a
            class="download-btn"
            href="${safeDownloadUrl}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ↓ Download
          </a>
        `;

      } else {

        downloadHTML = `
          <span
            class="download-btn disabled"
          >
            Download
          </span>
        `;

      }


      /* -------------------------------------------------------
         ESTIMATE CLASS
      ------------------------------------------------------- */

      const sizeClass =
        hasSheetSize
          ? "meta-value"
          : "meta-value estimated";


      return `
        <article class="software-card">

          <div class="card-image">
            ${imageHTML}
          </div>

          <div class="card-body">

            <span class="card-tag">
              ${category}
            </span>

            <h3>
              ${title}
            </h3>

            <p class="description">
              ${description}
            </p>

            <div class="meta">

              <div class="meta-item">
                <span class="meta-label">
                  Size
                </span>

                <span class="${sizeClass}">
                  ${size}
                </span>
              </div>

              <div class="meta-item">
                <span class="meta-label">
                  Version
                </span>

                <span class="meta-value">
                  ${version}
                </span>
              </div>

              <div class="meta-item">
                <span class="meta-label">
                  OS
                </span>

                <span class="meta-value">
                  ${os}
                </span>
              </div>

              <div class="meta-item">
                <span class="meta-label">
                  Developer
                </span>

                <span class="meta-value">
                  ${developer}
                </span>
              </div>

            </div>

            ${downloadHTML}

          </div>

        </article>
      `;

    }


    /* =========================================================
       EMPTY STATE
    ========================================================= */

    function showEmpty() {

      const grid =
        document.getElementById("softwareGrid");

      grid.innerHTML = `
        <div class="empty">

          <div style="font-size:2rem;margin-bottom:10px;">
            🔎
          </div>

          <strong>
            Software tidak ditemukan.
          </strong>

          <br>

          <span>
            Coba gunakan kata kunci atau kategori lain.
          </span>

        </div>
      `;

    }


    /* =========================================================
       ESCAPE HTML
    ========================================================= */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================================================
       CSV PARSER
       Support:
       - comma
       - quoted fields
       - comma inside quoted fields
       - double quotes inside quoted fields
    ========================================================= */

    function parseCSV(text) {

      const rows = [];
      let row = [];
      let field = "";
      let insideQuotes = false;

      for (
        let i = 0;
        i < text.length;
        i++
      ) {

        const char =
          text[i];

        const nextChar =
          text[i + 1];


        if (char === '"') {

          if (
            insideQuotes &&
            nextChar === '"'
          ) {

            field += '"';
            i++;

          } else {

            insideQuotes =
              !insideQuotes;

          }

        } else if (
          char === "," &&
          !insideQuotes
        ) {

          row.push(field);
          field = "";

        } else if (
          (char === "\n" || char === "\r") &&
          !insideQuotes
        ) {

          if (
            char === "\r" &&
            nextChar === "\n"
          ) {
            i++;
          }

          row.push(field);
          field = "";

          if (
            row.some(cell =>
              String(cell).trim() !== ""
            )
          ) {
            rows.push(row);
          }

          row = [];

        } else {

          field += char;

        }

      }


      if (
        field !== "" ||
        row.length > 0
      ) {

        row.push(field);

        if (
          row.some(cell =>
            String(cell).trim() !== ""
          )
        ) {
          rows.push(row);
        }

      }

      return rows;

    }


    /* =========================================================
       YEAR
    ========================================================= */

    document.getElementById("year")
      .textContent =
      new Date().getFullYear();


    /* =========================================================
       START
    ========================================================= */

    loadSoftware();

  </script>
